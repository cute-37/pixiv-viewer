<meta charset="utf-8">
<title>Pixiv Viewer</title>
<meta name="color-scheme" content="light dark">
<!-- 默认字体随程序自带（css/fonts.css + fonts/）。先按“打印用”加载、读完再启用，不拖慢界面出现 -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/toolbar.css">
<link rel="stylesheet" href="css/grid.css">
<link rel="stylesheet" href="css/viewer.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/downloader.css">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <symbol id="i-left" viewBox="0 0 16 16"><path d="m10 3.5-4.5 4.5 4.5 4.5"/></symbol>
    <symbol id="i-right" viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="m3.5 10 4.5-4.5 4.5 4.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="m3.5 6 4.5 4.5L12.5 6"/></symbol>

    <symbol id="i-rotate" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></symbol>
    <symbol id="i-book" viewBox="0 0 16 16"><path d="M8 4.5C6.5 3.3 4.5 3 2.5 3.2v9c2-.2 4 .1 5.5 1.3 1.5-1.2 3.5-1.5 5.5-1.3v-9C11.5 3 9.5 3.3 8 4.5ZM8 4.5v9"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5-7-4.5Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9"/></symbol>

    <symbol id="i-ext" viewBox="0 0 16 16"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M11.5 9.5v3.5h-9v-9H6"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.5 8.3 3 3 6-6.6"/></symbol>
    <symbol id="i-side" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6 3v10"/></symbol>
    <symbol id="i-star" viewBox="0 0 16 16"><path d="m8 2 1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.3l-3.7 2 .8-4.1L2 6.3l4.2-.5L8 2Z"/></symbol>
    <symbol id="i-folderplus" viewBox="0 0 16 16"><path d="M2 4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1zM8 7.5v3M6.5 9h3"/></symbol>
    <symbol id="i-chev" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4"/></symbol>

    <symbol id="i-dl" viewBox="0 0 16 16"><path d="M8 2v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></symbol>
    <symbol id="i-user" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.6 2.6-4 5-4s4.4 1.4 5 4"/></symbol>
    <symbol id="i-drive" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="4" rx="1"/><rect x="2" y="9" width="12" height="4" rx="1"/><path d="M4.5 5h.01M4.5 11h.01"/></symbol>
    <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 2.5 14 13H2zM8 6.5v3M8 11.3h.01"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 16 16"><path d="M3 4.500h6M12 4.500h1M3 11.500h1M7 11.500h6"/><circle cx="10.500" cy="4.500" r="1.500"/><circle cx="5.500" cy="11.500" r="1.500"/></symbol>
    <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.500 9.500a3 3 0 0 0 4.200 0l2-2a3 3 0 0 0-4.200-4.200l-.7.7M9.500 6.500a3 3 0 0 0-4.200 0l-2 2a3 3 0 0 0 4.200 4.200l.7-.7"/></symbol>
    <symbol id="i-unfold" viewBox="0 0 16 16"><path d="m4 4 4 4-4 4M9 4l4 4-4 4"/></symbol>
    <symbol id="i-fold" viewBox="0 0 16 16"><path d="m12 4-4 4 4 4M7 4 3 8l4 4"/></symbol>
    <symbol id="i-pages" viewBox="0 0 16 16"><rect x="4.5" y="2" width="9" height="10" rx="1.2"/><path d="M2.5 5v8.5a.5.5 0 0 0 .5.5h8"/></symbol>
    <symbol id="i-layout-u" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="6" rx="1"/><rect x="9" y="2" width="5" height="6" rx="1"/><rect x="2" y="10" width="5" height="4" rx="1"/><rect x="9" y="10" width="5" height="4" rx="1"/></symbol>
    <symbol id="i-layout-j" viewBox="0 0 16 16"><rect x="2" y="2.5" width="7" height="5" rx="1"/><rect x="10.5" y="2.5" width="3.5" height="5" rx="1"/><rect x="2" y="9" width="3.5" height="5" rx="1"/><rect x="7" y="9" width="7" height="5" rx="1"/></symbol>
    <symbol id="i-layout-m" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="7" rx="1"/><rect x="9" y="2" width="5" height="4" rx="1"/><rect x="2" y="11" width="5" height="3" rx="1"/><rect x="9" y="8" width="5" height="6" rx="1"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 4.5c0-.6.4-1 1-1h3l1.5 1.5H13c.6 0 1 .4 1 1V12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1V4.5Z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 16 16"><path d="M6 2.5h4l-.5 4 2 2v1h-7v-1l2-2-.5-4ZM8 9.5v4"/></symbol>
    <symbol id="i-tag" viewBox="0 0 16 16"><path d="M2.5 2.5h5l6 6-5 5-6-6v-5Z"/><circle cx="5.5" cy="5.5" r="1"/></symbol>
    <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5c0-.6-.4-1-1-1H3.5c-.6 0-1 .4-1 1V10c0 .6.4 1 1 1H5"/></symbol>
    <symbol id="i-export" viewBox="0 0 16 16"><path d="M8 2.5v8M5 5.5l3-3 3 3M3 10v2.5c0 .6.4 1 1 1h8c.6 0 1-.4 1-1V10"/></symbol>
    <symbol id="i-wall" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="8.5" rx="1.2"/><path d="M6 14h4M8 11v3M4 9l2.5-2.5L8.5 8.5 10 7l2 2"/></symbol>
    <symbol id="i-bg" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M2.5 8h11M8 2.5v11"/></symbol>
    <symbol id="i-locate" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.2"/><circle cx="8" cy="8" r="1" fill="currentColor"/><path d="M8 1.5v2.3M8 12.2v2.3M1.5 8h2.3M12.2 8h2.3"/></symbol>
    <symbol id="i-sort" viewBox="0 0 16 16"><path d="M5 3v10M2.5 10.5 5 13l2.5-2.5M11 13V3M8.5 5.5 11 3l2.5 2.5"/></symbol>
    <symbol id="i-cmd" viewBox="0 0 16 16"><path d="M5.5 5.5h5v5h-5zM5.5 5.5H4a1.5 1.5 0 1 1 1.5-1.5v1.5ZM10.5 5.5V4A1.5 1.5 0 1 1 12 5.5h-1.5ZM10.5 10.5H12a1.5 1.5 0 1 1-1.5 1.5v-1.5ZM5.5 10.5V12A1.5 1.5 0 1 1 4 10.5h1.5Z"/></symbol>
  </defs>
</svg>

<div id="app" class="app">
  <aside class="side" id="side" data-part="side">
    <div class="side-full">
      <div class="brand">
        <div class="logo">P</div><b>Pixiv Viewer</b>
        <button class="icon-btn" id="btn-collapse" title="收起侧栏 (Ctrl+B)" aria-label="收起侧栏"><svg class="i"><use href="#i-side"/></svg></button>
      </div>
      <nav class="nav" id="nav" aria-label="资料库"></nav>
      <div class="sect">
        <span>画师</span><span class="n" id="artist-total"></span><span class="sp"></span>
        <button class="icon-btn xs" id="btn-artist-locate" title="在列表里找到正在看的画师（画师页，或选中的作品的画师）" aria-label="定位当前画师"><svg class="i"><use href="#i-locate"/></svg></button>
        <button class="icon-btn xs" id="btn-folder-add" title="新建文件夹，用来给画师分类" aria-label="新建文件夹"><svg class="i"><use href="#i-folderplus"/></svg></button>
        <button class="icon-btn xs" id="btn-artist-sort" title="画师排序" aria-label="画师排序"><svg class="i"><use href="#i-sort"/></svg></button>
      </div>
      <label class="side-search"><svg class="i"><use href="#i-search"/></svg><input id="artist-filter" placeholder="筛选画师" aria-label="筛选画师"></label>
      <div class="artists" id="artists" role="listbox" aria-label="画师"></div>
      <div class="side-foot">
        <button class="row-btn" id="btn-dl" title="检查新作品并下载；管理账号和保存位置"><svg class="i"><use href="#i-dl"/></svg><span class="lbl">下载与更新</span><span class="n" id="dl-badge"></span></button>
        <button class="row-btn" id="btn-add-folder"><svg class="i"><use href="#i-plus"/></svg><span class="lbl">添加文件夹</span></button>
        <button class="row-btn" id="btn-settings"><svg class="i"><use href="#i-gear"/></svg><span class="lbl">设置</span><span class="kbd">Ctrl ,</span></button>
      </div>
    </div>
    <div class="side-rail">
      <button class="rail-logo" id="btn-expand" title="展开侧栏 (Ctrl+B)" aria-label="展开侧栏"><span class="logo">P</span><svg class="i"><use href="#i-side"/></svg></button>
      <div class="rail-nav">
        <button class="rail-btn" data-nav="all" title="全部图片"><svg class="i"><use href="#i-grid"/></svg></button>
        <button class="rail-btn" data-nav="recent" title="最近查看"><svg class="i"><use href="#i-clock"/></svg></button>
        <button class="rail-btn" data-nav="fav" title="收藏"><svg class="i"><use href="#i-heart"/></svg></button>
      </div>
      <span class="sp"></span>
      <div class="rail-foot">
        <button class="rail-btn" data-act="downloader" title="下载与更新"><svg class="i"><use href="#i-dl"/></svg></button>
        <button class="rail-btn" data-act="add-folder" title="添加文件夹"><svg class="i"><use href="#i-plus"/></svg></button>
        <button class="rail-btn" data-act="settings" title="设置 (Ctrl+,)"><svg class="i"><use href="#i-gear"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="resizer" id="side-resizer" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度" title="拖动调整宽度，双击恢复默认"></div>

  <section class="main" id="main">
    <header class="head" data-part="head">
      <div class="title" id="title-area"></div>
      <div class="search" id="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="q" placeholder="搜索画师、标签或文件名" autocomplete="off" aria-label="搜索">
        <span class="kbd">Ctrl F</span>
        <div class="suggest" id="suggest" hidden role="listbox" aria-label="搜索建议"></div>
      </div>
      <button class="icon-btn" id="btn-filters" title="更多筛选" aria-label="更多筛选"><svg class="i"><use href="#i-filter"/></svg></button>
      <button class="icon-btn" id="btn-mode" title="切换亮色 / 暗色" aria-label="切换亮色或暗色"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="btn-more" title="更多" aria-label="更多"><svg class="i"><use href="#i-more"/></svg></button>
    </header>

    <div class="bar" data-part="bar">
      <div class="seg" id="sort" role="group" aria-label="排序">
        <button data-v="id">最新</button><button data-v="time">修改时间</button><button data-v="name">文件名</button>
      </div>
      <div class="seg" id="rating" role="group" aria-label="分级">
        <button data-v="all">全部</button><button data-v="safe">全年龄</button><button data-v="r18">R18</button>
      </div>
      <div class="tagstrip" id="tagstrip">
        <div class="tagrow" id="tagrow"></div>
        <button class="chip more" id="tag-more" aria-haspopup="dialog"><svg class="i"><use href="#i-tag"/></svg><span id="tag-more-t">全部标签</span></button>
      </div>
      <div class="seg icon-seg" id="layout-quick" role="group" aria-label="布局">
        <button data-v="uniform" title="等比卡片"><svg class="i"><use href="#i-layout-u"/></svg></button>
        <button data-v="justified" title="齐行（保持原图比例）"><svg class="i"><use href="#i-layout-j"/></svg></button>
        <button data-v="masonry" title="瀑布流"><svg class="i"><use href="#i-layout-m"/></svg></button>
      </div>
      <label class="size" title="缩略图大小（Ctrl + 滚轮）"><svg class="i s"><use href="#i-grid"/></svg><input type="range" id="size-quick" min="110" max="340" aria-label="缩略图大小"><svg class="i"><use href="#i-grid"/></svg></label>
    </div>

    <div class="content" id="content" data-part="grid" tabindex="-1">
      <div id="grid-root"></div>
    </div>
    <footer class="status" id="status" data-part="status"></footer>

    <div class="batch" id="batch" hidden data-part="batch">
      <span class="count" id="batch-count"></span>
      <button class="bb" data-act="fav"><svg class="i"><use href="#i-heart"/></svg>收藏</button>
      <div class="bstars" id="batch-stars" title="评分（1–5）"></div>
      <button class="bb" data-act="tag"><svg class="i"><use href="#i-tag"/></svg>加标签</button>
      <button class="bb" data-act="export"><svg class="i"><use href="#i-export"/></svg>导出</button>
      <button class="bb" data-act="copy"><svg class="i"><use href="#i-copy"/></svg>复制路径</button>
      <button class="bb" data-act="reveal"><svg class="i"><use href="#i-folder"/></svg>打开位置</button>
      <button class="bb ghost" data-act="clear" title="取消选择 (Esc)"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
  </section>

  <section class="viewer" id="viewer" hidden>
    <!-- 看图页自己的顶栏：返回、作品名、页码；桌面版里它也是拖动窗口的地方 -->
    <header class="vhead" data-part="vhead">
      <button class="btn ghost" id="v-back" title="返回网格 (Esc)"><svg class="i"><use href="#i-left"/></svg>返回</button>
      <div class="vname" id="v-name"></div>
      <span class="sp"></span>
      <span class="vpage" id="v-page" hidden></span>
      <span class="vidx" id="v-idx"></span>
    </header>
    <div class="stage" id="stage" data-part="stage">
      <div class="canvas" id="canvas"><img id="v-img" alt="" draggable="false"></div>
      <button class="nav-arrow l glass" id="v-prev" title="上一个作品 (←)" aria-label="上一个作品"><svg class="i"><use href="#i-left"/></svg></button>
      <button class="nav-arrow r glass" id="v-next" title="下一个作品 (→)" aria-label="下一个作品"><svg class="i"><use href="#i-right"/></svg></button>
      <div class="vbar glass" data-part="vbar">
        <button data-v="zout" title="缩小 (-)"><svg class="i"><use href="#i-zout"/></svg></button>
        <button class="zoom" data-v="zoomreset" id="v-zoom" title="点击在 适应窗口 / 100% 之间切换">适应</button>
        <button data-v="zin" title="放大 (+)"><svg class="i"><use href="#i-zin"/></svg></button>
        <button data-v="rotate" title="旋转 (R)"><svg class="i"><use href="#i-rotate"/></svg></button>
        <span class="div"></span>
        <button data-v="bg" title="切换背景"><svg class="i"><use href="#i-bg"/></svg></button>
        <button data-v="fav" id="v-fav" title="收藏 (F)"><svg class="i"><use href="#i-heart"/></svg></button>
        <button data-v="slideshow" id="v-play" title="幻灯片 (F5)"><svg class="i"><use href="#i-play"/></svg></button>
        <button data-v="info" id="v-info" title="信息栏 (I)"><svg class="i"><use href="#i-info"/></svg></button>
      </div>
      <div class="slide-progress" id="slide-progress" hidden><i></i></div>
      <!-- 多页作品的“全部页”总览：盖在图片上，点一页就跳过去 -->
      <div class="pages-ov" id="pages-ov" hidden></div>
    </div>
    <div class="film" id="film" data-part="film"></div>
    <div class="resizer r" id="info-resizer" role="separator" aria-orientation="vertical" aria-label="调整信息栏宽度" title="拖动调整宽度，双击恢复默认"></div>
    <aside class="info" id="info" data-part="info"><div class="info-main" id="info-main"></div><div class="blk" id="info-more" hidden></div></aside>
  </section>

  <!-- 桌面版窗口没有系统标题栏：这里是自己的最小化 / 最大化 / 关闭按钮，左边一小段空白可以拖动窗口 -->
  <div class="peek" id="peek" hidden></div>

  <!-- 窗口上边缘和上面两个角：拖动调整窗口大小（其余三边由系统边框负责） -->
  <div class="win-edge t" data-edge="top"></div>
  <div class="win-edge tl" data-edge="topleft"></div>
  <div class="win-edge tr" data-edge="topright"></div>
  <div class="winctl" id="winctl" hidden>
    <div class="grip" data-drag></div>
    <button data-win="minimize" title="最小化" aria-label="最小化"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
    <button data-win="toggle" id="win-max" title="最大化" aria-label="最大化或还原"><svg viewBox="0 0 10 10"><path class="one" d="M.5.5h9v9h-9z"/><path class="two" d="M2.5 2.5V.5h7v7h-2M.5 2.5h7v7h-7z"/></svg></button>
    <button data-win="close" class="close" title="关闭" aria-label="关闭"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
  </div>

  <div class="quicklook" id="quicklook" hidden>
    <img id="ql-img" alt="">
    <div class="ql-cap" id="ql-cap"></div>
  </div>

  <div class="pop" id="tagpop" hidden role="dialog" aria-label="全部标签">
    <label class="search inpop"><svg class="i"><use href="#i-search"/></svg><input id="tag-q" placeholder="搜索标签，如 女の子、風景、原神" aria-label="搜索标签"></label>
    <div class="pop-sel" id="tag-sel"></div>

      <div class="seg sm" id="tag-sort"><button data-v="count">按数量</button><button data-v="name">按名称</button></div></div>

  <div class="scrim" id="scrim" hidden></div>

</div>
